name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

permissions:
  contents: read
  checks: write

jobs:
  # `audit` is one of the four status checks that branch protection on `main`
  # requires by name - read the note at the top of ci.yml before renaming it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit Node.js dependencies
        # GHSA-mh99-v99m-4gvg (CVE-2026-14257) is a DoS in brace-expansion via
        # minimatch@3.1.5, pulled in only by eslint dev tooling. There is no
        # patched 1.x and upgrading minimatch's brace-expansion to 5.x breaks
        # eslint at runtime (incompatible API), so it is allowlisted as dev-only.
        run: pnpm audit --ignore GHSA-mh99-v99m-4gvg

      # v2.0.0 is the newest release and still declares `using: node20`, so the
      # runner logs a deprecation notice for it. That is upstream's to fix; every
      # action this repository controls is on a node24 release.
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/desktop/src-tauri
