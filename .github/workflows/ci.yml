name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Renderer, design system and shared packages.
  web:
    name: Web (lint / typecheck / test / export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The renderer is a static export consumed by Tauri; a green typecheck
      # does not prove it can be exported (the Google-Fonts fetch made it fail
      # here historically).
      - name: Export renderer
        run: pnpm build

  # Rust core: formatting, clippy and unit tests.
  #
  # This job did not exist before: CI never compiled the Rust side, so the
  # desktop binary could rot (and did) while every badge stayed green. Bringing
  # it up found a raw-string parse error in the redaction patterns, a malformed
  # `for` loop, a missing `use tauri::Manager`, three git2 API mistakes and a
  # bundle resource path that pointed outside the repository - any one of which
  # breaks `tauri build` on Windows and Linux.
  #
  # `generate_context!()` embeds `frontendDist`, so the renderer must be
  # exported before the crate can compile.
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: System dependencies (WebKitGTK, GTK, OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export renderer (required by tauri generate_context!)
        run: pnpm build

      - name: rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
