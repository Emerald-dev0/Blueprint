name: Release

# Builds signed-less distributable bundles for macOS, Windows, and Linux and
# publishes them as a GitHub Release. Triggered by pushing a `v*` tag (e.g.
# `git tag v0.1.0 && git push origin v0.1.0`), or manually via Actions -> Run
# workflow (builds and uploads artifacts without creating a release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing/notarization is intentionally not configured yet: without
          # these env vars Tauri produces unsigned bundles. When certificates
          # exist, add APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD for macOS
          # and TAURI_SIGNING_PRIVATE_KEY for Windows/Linux updater signing.
        with:
          projectPath: apps/desktop
          createRelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Blueprint v__VERSION__'
          releaseBody: 'See the assets below to download and install this version. Signed builds and auto-update will follow once code-signing certificates are configured.'
          releaseDraft: false
          prerelease: false

      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
