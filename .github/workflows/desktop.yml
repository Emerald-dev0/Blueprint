name: Desktop bundles

# Produces real installers on every supported desktop OS.
#
# This workflow is the verification that was missing entirely: the repository
# previously shipped Tauri packaging configuration that had never been executed
# on any platform. Windows and Linux are the primary targets; macOS is included
# so the shared Rust core cannot regress on the third platform.
#
# Bundles run on push / manual dispatch. Pull requests are covered for compile
# correctness by the `rust` job in ci.yml (clippy builds the whole crate graph),
# which keeps PR feedback fast while merges produce distributable artifacts.

on:
  push:
    branches: [ main, develop ]
  # Bundle builds are expensive: three operating systems, each with a full cold
  # Rust compile. On a pull request they run only when the `build:bundles` label
  # is applied, which keeps ordinary PR feedback fast while still letting the
  # packaging path be verified on demand before a merge. Remove and re-add the
  # label to run it again.
  pull_request:
    types: [ labeled ]
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the baseline Tauri documents for AppImage glibc
          # compatibility; building on a newer image produces AppImages that
          # fail to start on the older distros we claim to support.
          - os: ubuntu-22.04
            platform: linux
            bundles: deb,rpm,appimage
            artifact-glob: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
            artifact-glob: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            platform: macos
            bundles: app,dmg
            artifact-glob: |
              apps/desktop/src-tauri/target/release/bundle/macos/*.app
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

    name: ${{ matrix.platform }} bundles
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'build:bundles'

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
